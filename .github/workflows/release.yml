name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/site.yml'

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build DMG
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./Scripts/make-dmg.sh

      - name: Publish rolling build
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Nocturne.dmg \
            --prerelease \
            --title "Latest build" \
            --notes "Automatically built from ${{ github.sha }}. Unsigned, so right-click the app and choose Open the first time."

      - name: Build appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./Scripts/make-appcast.sh "${GITHUB_REF_NAME}"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Nocturne.dmg Nocturne.zip appcast.xml \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Point the cask at the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          ./Scripts/update-cask.sh "${GITHUB_REF_NAME}"
          git add Casks/nocturne.rb
          git diff --cached --quiet || git commit -m "Point the cask at ${GITHUB_REF_NAME}"
          git push origin main
